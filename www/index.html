<script>

    },
    render(L,R,n){

}

/* ---------- MIDI (not available in iPhone Safari — button hidden there) ---------- */
let midi=null;
if(!navigator.requestMIDIAccess)$('#midigrp').style.display='none';
function midiMsg(e,inp){
  const sel=$('#midiin').value;if(sel&&sel!=='all'&&sel!==inp.id)return;
  const st=e.data[0],d1=e.data[1],d2=e.data[2],cmd=st&0xf0;
  if(cmd===0x90&&d2>0){noteOn(d1);mark(d1,1)}
  else if(cmd===0x80||(cmd===0x90&&d2===0)){noteOff(d1)}
  else if(cmd===0xE0){F.bend.set(((d2<<7)|d1)/16383)}
  else if(cmd===0xB0){const v=d2/127;
    const map={1:'mw',7:'vol',74:'cut',71:'res',73:'aa',72:'ar',5:'glide',91:'rmix',93:'cho',94:'dmix'};
    if(d1===64)setHold(d2>=64);else if(map[d1]&&F[map[d1]])F[map[d1]].set(v);
    else if(d1===123||d1===120)releaseAll()}
}
function midiFill(){const sel=$('#midiin'),cur=sel.value;sel.innerHTML='<option value="all">All MIDI inputs</option>';
  let n=0;midi.inputs.forEach(inp=>{n++;sel.insertAdjacentHTML('beforeend',`<option value="${inp.id}">${inp.name}</option>`);inp.onmidimessage=e=>midiMsg(e,inp)});
  sel.value=Array.prototype.some.call(sel.options,o=>o.value===cur)?cur:'all';sel.style.display='';
  $('#midibtn').classList.add('on');$('#midibtn').textContent=n?`MIDI ●${n}`:'MIDI (none)';return n}
$('#midibtn').onclick=async()=>{
  start();
  if(midi){toast(midiFill()?'MIDI inputs refreshed':'No MIDI devices found');return}
  try{midi=await navigator.requestMIDIAccess();midi.onstatechange=()=>midiFill();
    const n=midiFill();toast(n?`MIDI connected: ${n} input(s)`:'MIDI ready — no devices found yet')}
  catch(e){toast('MIDI is blocked in this viewer.')}
};

/* ---------- scope ---------- */
const cv=$('#scope'),cx=cv.getContext('2d');const buf=new Float32Array(2048);let bbuf=null;
function drawScope(){requestAnimationFrame(drawScope);if(cv.offsetParent===null)return;
  if(an.getFloatTimeDomainData)an.getFloatTimeDomainData(buf);
  else{bbuf=bbuf||new Uint8Array(2048);an.getByteTimeDomainData(bbuf);for(let i=0;i<2048;i++)buf[i]=(bbuf[i]-128)/128}
  cx.fillStyle='rgba(7,11,16,.45)';cx.fillRect(0,0,cv.width,cv.height);
  let s=0;for(let i=1;i<1024;i++)if(buf[i-1]<0&&buf[i]>=0){s=i;break}
  cx.beginPath();cx.strokeStyle='#3dffa0';cx.lineWidth=2;if(!IOS){cx.shadowColor='#3dffa0';cx.shadowBlur=6}
  for(let i=0;i<700;i++){const x=i/700*cv.width,y=cv.height/2-buf[s+i]*cv.height*.45;i?cx.lineTo(x,y):cx.moveTo(x,y)}
  cx.stroke();cx.shadowBlur=0}
